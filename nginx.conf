server {
    listen 80;
    server_name sabi.yourdomain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sabi.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/sabi.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabi.yourdomain.com/privkey.pem;

    # Proxy to Sabi server
    location / {
        proxy_pass http://sabi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large audio uploads
        client_max_body_size 50M;

        # Timeout for AI processing
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Serve audio files directly (faster than proxying)
    location /audio/ {
        proxy_pass http://sabi:8000/audio/;
        proxy_cache_valid 200 5m;
    }
}
