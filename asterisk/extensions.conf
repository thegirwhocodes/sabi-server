; =============================================================================
; Sabi PBX — Dialplan for Flash Callback
; =============================================================================
; Flow:
; 1. Child calls AT number → AT routes to us via SIP
; 2. We grab caller ID and immediately hang up (child pays ₦0)
; 3. On hangup, trigger FastAPI to initiate outbound callback
; 4. FastAPI sends AMI Originate → Asterisk calls child back via AT SIP
; 5. Child answers → FastAGI handler runs the lesson
; =============================================================================

[general]
static=yes
writeprotect=yes

; --- Incoming calls from Africa's Talking (or test softphone) ---
[from-at]
; Flash callback: grab caller ID, hang up immediately
; NO Answer() before Hangup() — child is NOT billed
exten => _X.,1,NoOp(== Flash callback: incoming from ${CALLERID(num)} ==)
 same => n,Set(CALLBACK_NUM=${CALLERID(num)})
 same => n,Hangup()

; After hangup, trigger outbound callback via FastAPI
exten => h,1,NoOp(== Triggering callback to ${CALLBACK_NUM} ==)
 same => n,System(curl -s -X POST http://sabi:8000/asterisk/flash -H "Content-Type: application/x-www-form-urlencoded" -d "phone=${CALLBACK_NUM}" &)

; --- Test extension: dial 100 for direct lesson (no flash callback) ---
; Use this with a softphone to test the full STT→LLM→TTS pipeline
exten => 100,1,NoOp(== TEST: Direct lesson for ${CALLERID(num)} ==)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://sabi:4573)
 same => n,Hangup()

; --- Outbound callback: lesson flow ---
[sabi-callback]
exten => _X.,1,NoOp(== Sabi lesson callback to ${EXTEN} ==)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://sabi:4573)
 same => n,Hangup()
