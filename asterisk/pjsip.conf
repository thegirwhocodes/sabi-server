; =============================================================================
; Sabi PBX — PJSIP Configuration for Africa's Talking SIP Trunk
; =============================================================================
; AT uses IP-based authentication: they whitelist our server IP (136.243.8.51).
; No SIP credentials needed — just the IP whitelist.
;
; SETUP: In the AT dashboard, set your voice number's callback URL to:
;   trunk:136.243.8.51
;
; After AT confirms whitelisting, replace AT_SIP_SERVER and AT_SIP_IP below
; with the actual values AT provides.
; =============================================================================

; --- Transport ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Africa's Talking Endpoint ---
[africastalking]
type=endpoint
transport=transport-udp
context=from-at
disallow=all
allow=ulaw
allow=alaw
aors=at-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; --- AOR (Address of Record) ---
[at-aor]
type=aor
; Replace with AT's SIP server address (they'll provide this after setup)
contact=sip:AT_SIP_SERVER:5060

; --- Identify AT by IP (no credentials needed) ---
[at-identify]
type=identify
endpoint=africastalking
; Replace with AT's SIP server IP address
match=AT_SIP_IP

; =============================================================================
; Local test endpoint (for testing with a softphone before AT SIP is ready)
; Register a SIP softphone (Zoiper/Linphone) with these credentials
; =============================================================================
[test-phone]
type=endpoint
transport=transport-udp
context=from-at
disallow=all
allow=ulaw
allow=alaw
auth=test-phone-auth
aors=test-phone-aor
direct_media=no

[test-phone-auth]
type=auth
auth_type=userpass
username=testuser
password=testpass123

[test-phone-aor]
type=aor
max_contacts=1
