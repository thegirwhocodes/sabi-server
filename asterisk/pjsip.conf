; =============================================================================
; Sabi PBX — PJSIP Configuration for Twilio and Africa's Talking SIP Trunks
; =============================================================================
; AT uses IP-based authentication: they whitelist our server IP (136.243.8.51).
; No SIP credentials needed — just the IP whitelist.
;
; SETUP: In the AT dashboard, set your voice number's callback URL to:
;   trunk:136.243.8.51
;
; Africa's Talking Nigeria SIP details confirmed June 11, 2026:
;   FQDN: ng.sip.africastalking.com
;   IP: 102.223.37.68
;   Port: 5060/udp
;   Codec: PCMA/PCMU
;   DID: +2342017001459
; =============================================================================

; --- Transport ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Asterisk runs inside Docker, so advertise the public server IP in SIP/SDP.
; Without this, AT may receive Docker/private media addresses and audio breaks.
external_signaling_address=136.243.8.51
external_signaling_port=5060
external_media_address=136.243.8.51
local_net=172.18.0.0/16

; --- Africa's Talking Endpoint ---
[africastalking]
type=endpoint
transport=transport-udp
context=from-at
disallow=all
allow=alaw
; AT Nigeria offered PCMA first in live SIP traces. Keep the test path on PCMA
; so Asterisk answers with payload 8 instead of choosing PCMU.
aors=at-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=+2342017001459
from_domain=ng.sip.africastalking.com

; --- AOR (Address of Record) ---
[at-aor]
type=aor
contact=sip:ng.sip.africastalking.com:5060

; --- Identify AT by IP (no credentials needed) ---
[at-identify]
type=identify
endpoint=africastalking
match=102.223.37.68

; --- Twilio Elastic SIP Trunk ---
; The Twilio trunk authenticates Sabi's fixed production IP with an IP ACL.
; It does not register and it does not store SIP credentials on this server.
[twilio]
type=endpoint
transport=transport-udp
context=from-twilio
disallow=all
; Twilio and US PSTN calls prefer G.711 mu-law. Keep A-law available for
; international routes while avoiding an unnecessary codec conversion.
allow=ulaw
allow=alaw
aors=twilio-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=+17153122345
from_domain=sabi-education-for-equality.pstn.twilio.com
trust_id_outbound=yes
send_pai=yes

[twilio-aor]
type=aor
contact=sip:sabi-education-for-equality.pstn.twilio.com:5060

; Twilio's incoming test route is pinned to the Ashburn edge. Keep Oregon and
; Dublin available for Twilio failover without accepting arbitrary SIP hosts.
[twilio-identify]
type=identify
endpoint=twilio
match=54.172.60.0/23
match=54.244.51.0/24
match=54.171.127.192/26
