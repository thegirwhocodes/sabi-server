<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabi Co-Founder Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-icon {
            font-size: 32px;
            margin-right: 12px;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .stat {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .goal-item, .task-item, .opp-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .goal-title, .task-title, .opp-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .goal-meta, .task-meta, .opp-meta {
            font-size: 12px;
            color: #666;
        }
        
        .priority-high { border-left: 4px solid #f44336; }
        .priority-medium { border-left: 4px solid #ff9800; }
        .priority-low { border-left: 4px solid #4caf50; }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .score-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .score-high { background: #4caf50; color: white; }
        .score-medium { background: #ff9800; color: white; }
        .score-low { background: #f44336; color: white; }
        
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover {
            transform: scale(1.1);
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Sabi Co-Founder Agent</h1>
            <p class="subtitle">Your AI operational partner for building Sabi</p>
        </header>
        
        <div id="dashboard-content" class="loading">
            Loading dashboard...
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadDashboard()" title="Refresh">↻</button>
    
    <script>
        async function loadDashboard() {
            const content = document.getElementById('dashboard-content');
            content.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                renderDashboard(data);
            } catch (error) {
                content.innerHTML = `<div class="card"><p style="color: #f44336;">Error loading dashboard: ${error.message}</p></div>`;
            }
        }
        
        function renderDashboard(data) {
            const content = document.getElementById('dashboard-content');
            
            const goalsData = data.goals;
            const oppsData = data.opportunities;
            const accData = data.accountability;
            const nextActions = data.next_actions;
            
            // Calculate accountability score badge
            const score = accData.score;
            const scoreBadge = score >= 0.8 ? 'score-high' : score >= 0.6 ? 'score-medium' : 'score-low';
            
            content.innerHTML = `
                <div class="grid">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">📊</span>
                            <span class="card-title">Goals</span>
                        </div>
                        <div class="stat">${goalsData.active_goals}</div>
                        <div class="stat-label">Active Goals</div>
                        <div style="margin-top: 16px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="font-size: 14px; color: #666;">Tasks: ${goalsData.pending_user_tasks} pending</span>
                                <span style="font-size: 14px; color: #666;">${goalsData.blocked_tasks} blocked</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">💡</span>
                            <span class="card-title">Opportunities</span>
                        </div>
                        <div class="stat">${oppsData.active_opportunities}</div>
                        <div class="stat-label">Active Opportunities</div>
                        <div style="margin-top: 16px;">
                            <div style="font-size: 14px; color: #666;">
                                ${oppsData.high_fit_count} high-fit | ${oppsData.upcoming_deadlines} upcoming
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">✅</span>
                            <span class="card-title">Accountability</span>
                        </div>
                        <span class="score-badge ${scoreBadge}">${(score * 100).toFixed(0)}%</span>
                        <div style="margin-top: 16px;">
                            <div style="font-size: 14px; color: #666;">
                                ${accData.active_commitments} active commitments<br>
                                ${accData.overdue_commitments} overdue
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="grid">
                    <div class="card" style="grid-column: span 2;">
                        <div class="card-header">
                            <span class="card-icon">🎯</span>
                            <span class="card-title">Your Goals</span>
                        </div>
                        <div id="goals-list"></div>
                        <div class="actions">
                            <button class="btn" onclick="showAddGoalForm()">+ Add Goal</button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">📋</span>
                            <span class="card-title">Next Actions</span>
                        </div>
                        <div id="next-actions-list"></div>
                    </div>
                </div>
            `;
            
            // Render goals
            renderGoals(goalsData.goals);
            
            // Render next actions
            renderNextActions(nextActions.next_actions);
        }
        
        function renderGoals(goals) {
            const list = document.getElementById('goals-list');
            
            if (!goals || goals.length === 0) {
                list.innerHTML = '<div class="empty-state">No active goals yet. Create your first goal!</div>';
                return;
            }
            
            list.innerHTML = goals.map(goal => {
                const progress = goal.progress.progress;
                const priorityClass = `priority-${goal.priority}`;
                
                return `
                    <div class="goal-item ${priorityClass}">
                        <div class="goal-title">${goal.title}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div class="goal-meta">
                            ${progress.toFixed(1)}% complete | 
                            ${goal.progress.completed}/${goal.progress.total} tasks | 
                            Priority: ${goal.priority}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderNextActions(actions) {
            const list = document.getElementById('next-actions-list');
            
            if (!actions || actions.length === 0) {
                list.innerHTML = '<div class="empty-state">All caught up! 🎉</div>';
                return;
            }
            
            list.innerHTML = actions.slice(0, 5).map((action, i) => {
                const title = action.title || action.description;
                const priority = action.priority || '';
                const icon = priority === 'URGENT' || priority === 'HIGH' ? '🔥' : '○';
                
                return `
                    <div class="task-item">
                        <div style="display: flex; align-items: center;">
                            <span style="margin-right: 8px;">${icon}</span>
                            <div style="flex: 1;">
                                <div class="task-title">${title}</div>
                                ${priority ? `<div class="task-meta">Priority: ${priority}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function showAddGoalForm() {
            alert('Feature coming soon! For now, use the CLI:\n\npython3 cofounder_agent/cli.py goal create "Your Goal" "Description"');
        }
        
        // Load dashboard on page load
        loadDashboard();
        
        // Auto-refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
