; =============================================================================
; Asterisk Manager Interface (AMI) — used by FastAPI to originate calls
; =============================================================================

[general]
enabled=yes
port=5038
bindaddr=0.0.0.0

; Sabi server AMI user (Docker network access only)
[sabi]
secret=sabi_ami_secret_change_me
read=system,call,log
write=system,call,originate
deny=0.0.0.0/0.0.0.0
; Allow Docker bridge network (172.x.x.x)
permit=172.0.0.0/255.0.0.0
; Allow localhost
permit=127.0.0.1/255.255.255.255
