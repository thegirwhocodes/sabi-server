# Temporary HTTP-only nginx config for Let's Encrypt certificate setup.
# Used by server-setup.sh during first boot only.
# After certbot obtains the SSL certificate, this is replaced with nginx.conf.

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Simple health response while setting up
    location / {
        return 200 'Sabi is setting up SSL...';
        add_header Content-Type text/plain;
    }
}
