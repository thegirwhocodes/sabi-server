; =============================================================================
; Sabi PBX — Dialplan for Realtime AudioSocket Calls
; =============================================================================
; Flow:
; 1. Child calls the Twilio or AT number → carrier routes to us via SIP
; 2. Asterisk answers and opens a full-duplex AudioSocket stream to Sabi
; 3. Sabi plays TTS and listens to caller audio at the same time
; 4. If the child speaks while Sabi is talking, Sabi stops and handles it
; =============================================================================

[general]
static=yes
writeprotect=yes

; --- Incoming calls from Africa's Talking ---
[from-at]
; Direct call-in is the default. Sabi can route specific testing caller IDs to
; flash-callback by returning "flash" from /asterisk/inbound-route.
exten => _+X.,1,Set(SAFE_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(SABI_ROUTE=${SHELL(curl -s -m 1 -X POST http://sabi:8000/asterisk/inbound-route --data-urlencode "phone=${SAFE_CALLER}" | tr -d '\n')})
 same => n,GotoIf($["${SABI_ROUTE}" = "flash"]?sabi-flash,s,1)
 same => n,Goto(sabi-inbound,s,1)
exten => _X.,1,Set(SAFE_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(SABI_ROUTE=${SHELL(curl -s -m 1 -X POST http://sabi:8000/asterisk/inbound-route --data-urlencode "phone=${SAFE_CALLER}" | tr -d '\n')})
 same => n,GotoIf($["${SABI_ROUTE}" = "flash"]?sabi-flash,s,1)
 same => n,Goto(sabi-inbound,s,1)

; --- Incoming calls from Twilio ---
; Twilio calls are already on the published US line, so connect them directly
; to the same AudioSocket lesson lane instead of using AT's flash-callback.
[from-twilio]
exten => _+X.,1,Goto(sabi-inbound,s,1)
exten => _X.,1,Goto(sabi-inbound,s,1)
exten => s,1,Goto(sabi-inbound,s,1)

[sabi-flash]
exten => s,1,NoOp(== Flash callback request from ${CALLERID(num)} ==)
 same => n,Set(CALLBACK_NUM=${FILTER(0-9+,${CALLERID(num)})})
 same => n,GotoIf($["${CALLBACK_NUM}" = ""]?missing-caller)
 same => n,Ringing()
 same => n,Wait(2)
 same => n,Hangup(16)
 same => n(missing-caller),NoOp(== Cannot flash-callback call with missing caller ID ==)
 same => n,Hangup(21)

exten => h,1,NoOp(== Post-hangup callback trigger for ${CALLBACK_NUM} ==)
 same => n,GotoIf($["${CALLBACK_NUM}" = ""]?done)
 same => n,System(curl -s -m 2 -X POST http://sabi:8000/asterisk/flash -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "phone=${CALLBACK_NUM}" >/dev/null &)
 same => n(done),NoOp(== Flash callback handoff complete ==)

[sabi-inbound]
exten => s,1,NoOp(== Inbound SIP lesson from ${CALLERID(num)} to ${DIALED_NUM} ==)
 same => n,System(mkdir -p /shared/audio/calls)
 same => n,Set(CALL_BASE=/shared/audio/calls/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${CALLERID(num)}_${UNIQUEID})
 same => n,Set(CALL_REC=${CALL_BASE}.wav)
 same => n,Set(CALL_RX=${CALL_BASE}_rx-network.wav)
 same => n,Set(CALL_TX=${CALL_BASE}_tx-sabi.wav)
 same => n,MixMonitor(${CALL_REC},r(${CALL_RX})t(${CALL_TX}))
 same => n,Set(AS_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Set(SAFE_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(CALLBACK_ATTEMPT=1)
 same => n,TrySystem(curl -fsS -m 1 http://sabi:8000/health >/dev/null)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?sabi-unavailable)
 same => n,Set(REGISTER_STATUS=${SHELL(curl -s -m 2 -o /dev/null -w "%{http_code}" -X POST http://sabi:8000/asterisk/audiosocket/register --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=inbound" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" | tr -d '\n')})
 same => n,GotoIf($["${REGISTER_STATUS}" != "200"]?sabi-unavailable)
 same => n,Answer()
 ; Gemini 3.5 Flash-Lite lesson-aware STT promoted from the isolated lane.
 same => n,AudioSocket(${AS_UUID},sabi:9020)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(sabi-unavailable),NoOp(== Sabi unavailable before answer uuid=${AS_UUID} status=${REGISTER_STATUS} system=${SYSTEMSTATUS} ==)
 same => n,StopMixMonitor()
 same => n,Hangup(34)

exten => h,1,NoOp(== Inbound hangup uuid=${AS_UUID} caller=${SAFE_CALLER} cause=${HANGUPCAUSE} duration=${CDR(duration)} billsec=${CDR(billsec)} ==)
 same => n,System(curl -s -m 2 -X POST http://sabi:8000/asterisk/hangup --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=inbound" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" --data-urlencode "hangup_cause=${HANGUPCAUSE}" --data-urlencode "dialstatus=${DIALSTATUS}" --data-urlencode "duration=${CDR(duration)}" --data-urlencode "billsec=${CDR(billsec)}" --data-urlencode "channel=${CHANNEL}" --data-urlencode "recording=${CALL_REC}" --data-urlencode "uniqueid=${UNIQUEID}" >/dev/null)

; --- Outbound callback: lesson flow ---
[sabi-callback]
exten => _+X.,1,Set(CALLBACK_TARGET=${EXTEN})
 same => n,Goto(sabi-callback-run,s,1)
exten => _X.,1,Set(CALLBACK_TARGET=${EXTEN})
 same => n,Goto(sabi-callback-run,s,1)

[sabi-callback-run]
exten => s,1,NoOp(== Sabi lesson callback to ${CALLBACK_TARGET} ==)
 same => n,System(mkdir -p /shared/audio/calls)
 same => n,Set(SAFE_CALLER=${FILTER(0-9+,${CALLBACK_TARGET})})
 same => n,Set(CALL_BASE=/shared/audio/calls/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${SAFE_CALLER}_${UNIQUEID})
 same => n,Set(CALL_REC=${CALL_BASE}.wav)
 same => n,Set(CALL_RX=${CALL_BASE}_rx-network.wav)
 same => n,Set(CALL_TX=${CALL_BASE}_tx-sabi.wav)
 same => n,MixMonitor(${CALL_REC},r(${CALL_RX})t(${CALL_TX}))
 same => n,Set(AS_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Set(CALLBACK_ATTEMPT=${SABI_CALLBACK_ATTEMPT})
 same => n,GotoIf($["${CALLBACK_ATTEMPT}" != ""]?have-attempt)
 same => n,Set(CALLBACK_ATTEMPT=1)
 same => n(have-attempt),NoOp(== Callback attempt ${CALLBACK_ATTEMPT} ==)
 same => n,TrySystem(curl -fsS -m 1 http://sabi:8000/health >/dev/null)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?sabi-unavailable)
 same => n,Set(REGISTER_STATUS=${SHELL(curl -s -m 2 -o /dev/null -w "%{http_code}" -X POST http://sabi:8000/asterisk/audiosocket/register --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=callback" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" | tr -d '\n')})
 same => n,GotoIf($["${REGISTER_STATUS}" != "200"]?sabi-unavailable)
 same => n,Answer()
 ; Restore the original callback behavior: give the answered handset's media
 ; path one second to settle before Sabi begins speaking.
 same => n,Wait(1)
 ; Gemini 3.5 Flash-Lite lesson-aware STT promoted from the isolated lane.
 same => n,AudioSocket(${AS_UUID},sabi:9020)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(sabi-unavailable),NoOp(== Sabi unavailable before callback answer uuid=${AS_UUID} status=${REGISTER_STATUS} system=${SYSTEMSTATUS} ==)
 same => n,StopMixMonitor()
 same => n,Hangup(34)

exten => h,1,NoOp(== Callback hangup uuid=${AS_UUID} caller=${SAFE_CALLER} cause=${HANGUPCAUSE} dialstatus=${DIALSTATUS} duration=${CDR(duration)} billsec=${CDR(billsec)} ==)
 same => n,System(curl -s -m 2 -X POST http://sabi:8000/asterisk/hangup --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=callback" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" --data-urlencode "hangup_cause=${HANGUPCAUSE}" --data-urlencode "dialstatus=${DIALSTATUS}" --data-urlencode "duration=${CDR(duration)}" --data-urlencode "billsec=${CDR(billsec)}" --data-urlencode "channel=${CHANNEL}" --data-urlencode "recording=${CALL_REC}" --data-urlencode "uniqueid=${UNIQUEID}" >/dev/null)

; --- Outbound callback test lane: same call UX, isolated Intron STT route ---
[sabi-callback-intron]
exten => _+X.,1,Set(CALLBACK_TARGET=${EXTEN})
 same => n,Goto(sabi-callback-intron-run,s,1)
exten => _X.,1,Set(CALLBACK_TARGET=${EXTEN})
 same => n,Goto(sabi-callback-intron-run,s,1)

[sabi-callback-intron-run]
exten => s,1,NoOp(== Sabi Intron STT test callback to ${CALLBACK_TARGET} ==)
 same => n,System(mkdir -p /shared/audio/calls)
 same => n,Set(SAFE_CALLER=${FILTER(0-9+,${CALLBACK_TARGET})})
 same => n,Set(CALL_BASE=/shared/audio/calls/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${SAFE_CALLER}_${UNIQUEID})
 same => n,Set(CALL_REC=${CALL_BASE}.wav)
 same => n,Set(CALL_RX=${CALL_BASE}_rx-network.wav)
 same => n,Set(CALL_TX=${CALL_BASE}_tx-sabi.wav)
 same => n,MixMonitor(${CALL_REC},r(${CALL_RX})t(${CALL_TX}))
 same => n,Set(AS_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Set(CALLBACK_ATTEMPT=${SABI_CALLBACK_ATTEMPT})
 same => n,GotoIf($["${CALLBACK_ATTEMPT}" != ""]?have-attempt)
 same => n,Set(CALLBACK_ATTEMPT=1)
 same => n(have-attempt),NoOp(== Intron callback attempt ${CALLBACK_ATTEMPT} ==)
 same => n,TrySystem(curl -fsS -m 1 http://sabi:8000/health >/dev/null)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?sabi-unavailable)
 same => n,Set(REGISTER_STATUS=${SHELL(curl -s -m 2 -o /dev/null -w "%{http_code}" -X POST http://sabi:8000/asterisk/audiosocket/register --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=callback-intron" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" | tr -d '\n')})
 same => n,GotoIf($["${REGISTER_STATUS}" != "200"]?sabi-unavailable)
 same => n,Answer()
 same => n,AudioSocket(${AS_UUID},sabi:9020)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(sabi-unavailable),NoOp(== Sabi Intron unavailable before callback answer uuid=${AS_UUID} status=${REGISTER_STATUS} system=${SYSTEMSTATUS} ==)
 same => n,StopMixMonitor()
 same => n,Hangup(34)

exten => h,1,NoOp(== Intron callback hangup uuid=${AS_UUID} caller=${SAFE_CALLER} cause=${HANGUPCAUSE} dialstatus=${DIALSTATUS} duration=${CDR(duration)} billsec=${CDR(billsec)} ==)
 same => n,System(curl -s -m 2 -X POST http://sabi:8000/asterisk/hangup --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=callback-intron" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" --data-urlencode "hangup_cause=${HANGUPCAUSE}" --data-urlencode "dialstatus=${DIALSTATUS}" --data-urlencode "duration=${CDR(duration)}" --data-urlencode "billsec=${CDR(billsec)}" --data-urlencode "channel=${CHANNEL}" --data-urlencode "recording=${CALL_REC}" --data-urlencode "uniqueid=${UNIQUEID}" >/dev/null)

; --- Outbound comparison lane: original hackathon prompt + current Gemini STT ---
[sabi-callback-original]
exten => _+X.,1,Set(CALLBACK_TARGET=${EXTEN})
 same => n,Goto(sabi-callback-original-run,s,1)
exten => _X.,1,Set(CALLBACK_TARGET=${EXTEN})
 same => n,Goto(sabi-callback-original-run,s,1)

[sabi-callback-original-run]
exten => s,1,NoOp(== Original Sabi + Gemini callback to ${CALLBACK_TARGET} ==)
 same => n,System(mkdir -p /shared/audio/calls)
 same => n,Set(SAFE_CALLER=${FILTER(0-9+,${CALLBACK_TARGET})})
 same => n,Set(CALL_BASE=/shared/audio/calls/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${SAFE_CALLER}_${UNIQUEID})
 same => n,Set(CALL_REC=${CALL_BASE}.wav)
 same => n,Set(CALL_RX=${CALL_BASE}_rx-network.wav)
 same => n,Set(CALL_TX=${CALL_BASE}_tx-sabi.wav)
 same => n,MixMonitor(${CALL_REC},r(${CALL_RX})t(${CALL_TX}))
 same => n,Set(AS_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Set(CALLBACK_ATTEMPT=${SABI_CALLBACK_ATTEMPT})
 same => n,GotoIf($["${CALLBACK_ATTEMPT}" != ""]?have-attempt)
 same => n,Set(CALLBACK_ATTEMPT=1)
 same => n(have-attempt),NoOp(== Original Sabi callback attempt ${CALLBACK_ATTEMPT} ==)
 same => n,TrySystem(curl -fsS -m 1 http://sabi:8000/health >/dev/null)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?sabi-unavailable)
 same => n,Set(REGISTER_STATUS=${SHELL(curl -s -m 2 -o /dev/null -w "%{http_code}" -X POST http://sabi:8000/asterisk/audiosocket/register --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=callback-original" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" | tr -d '\n')})
 same => n,GotoIf($["${REGISTER_STATUS}" != "200"]?sabi-unavailable)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AudioSocket(${AS_UUID},sabi:9021)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(sabi-unavailable),NoOp(== Original Sabi unavailable uuid=${AS_UUID} status=${REGISTER_STATUS} system=${SYSTEMSTATUS} ==)
 same => n,StopMixMonitor()
 same => n,Hangup(34)

exten => h,1,NoOp(== Original Sabi callback hangup uuid=${AS_UUID} caller=${SAFE_CALLER} cause=${HANGUPCAUSE} dialstatus=${DIALSTATUS} duration=${CDR(duration)} billsec=${CDR(billsec)} ==)
 same => n,System(curl -s -m 2 -X POST http://sabi:8000/asterisk/hangup --data-urlencode "uuid=${AS_UUID}" --data-urlencode "phone=${SAFE_CALLER}" --data-urlencode "mode=callback-original" --data-urlencode "attempt=${CALLBACK_ATTEMPT}" --data-urlencode "hangup_cause=${HANGUPCAUSE}" --data-urlencode "dialstatus=${DIALSTATUS}" --data-urlencode "duration=${CDR(duration)}" --data-urlencode "billsec=${CDR(billsec)}" --data-urlencode "channel=${CHANNEL}" --data-urlencode "recording=${CALL_REC}" --data-urlencode "uniqueid=${UNIQUEID}" >/dev/null)
