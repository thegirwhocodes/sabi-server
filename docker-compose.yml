services:
  # Asterisk PBX for SIP flash callback (child pays ₦0)
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: sabi-asterisk
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./asterisk/modules.conf:/etc/asterisk/modules.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - shared_audio:/shared/audio
    restart: unless-stopped

  # Self-hosted LLM (Ollama with Llama 3.1 8B)
  ollama:
    image: ollama/ollama:latest
    container_name: sabi-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Sabi voice server (FastAPI + Whisper + YarnGPT TTS + Claude/Ollama LLM)
  sabi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabi-server
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:4573:4573"
      - "127.0.0.1:9019:9019"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - AMI_HOST=asterisk
      - CHATTERBOX_URL=http://sabi-chatterbox:8001
    secrets:
      - ANTHROPIC_API_KEY
      - GROQ_API_KEY
      - YARNGPT_API_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - SABI_API_KEY
      - AT_API_KEY
      - ELEVENLABS_API_KEY
      - ELEVENLABS_VOICE_ID
      - TWILIO_AUTH_TOKEN
    volumes:
      - ./audio_cache:/app/audio_cache
      - shared_audio:/shared/audio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - ollama
    restart: unless-stopped

  # Chatterbox Turbo TTS: Emotionally expressive Nigerian English voice
  chatterbox-tts:
    build:
      context: ./chatterbox-tts
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: sabi-chatterbox
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - CHATTERBOX_REFERENCE_DIR=/app/reference_audio
      - CHATTERBOX_DEFAULT_SPEAKER=naomi
      - CHATTERBOX_MAX_CONCURRENT=${CHATTERBOX_MAX_CONCURRENT:-1}
      - CHATTERBOX_MAX_QUEUE=${CHATTERBOX_MAX_QUEUE:-12}
      - CHATTERBOX_QUEUE_TIMEOUT_SECONDS=${CHATTERBOX_QUEUE_TIMEOUT_SECONDS:-8}
      - CHATTERBOX_CACHE_ENABLED=${CHATTERBOX_CACHE_ENABLED:-1}
      - CHATTERBOX_CACHE_DIR=/app/tts_cache
      - CHATTERBOX_CACHE_MAX_FILES=${CHATTERBOX_CACHE_MAX_FILES:-5000}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - chatterbox_cache:/root/.cache
      - chatterbox_tts_cache:/app/tts_cache
      - ./chatterbox-tts/reference_audio:/app/reference_audio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: sabi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - sabi
    restart: unless-stopped

  # SSL certificate manager
  certbot:
    image: certbot/certbot
    container_name: sabi-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

secrets:
  ANTHROPIC_API_KEY:
    file: ./secrets/ANTHROPIC_API_KEY
  GROQ_API_KEY:
    file: ./secrets/GROQ_API_KEY
  YARNGPT_API_KEY:
    file: ./secrets/YARNGPT_API_KEY
  SUPABASE_SERVICE_ROLE_KEY:
    file: ./secrets/SUPABASE_SERVICE_ROLE_KEY
  SABI_API_KEY:
    file: ./secrets/SABI_API_KEY
  AT_API_KEY:
    file: ./secrets/AT_API_KEY
  ELEVENLABS_API_KEY:
    file: ./secrets/ELEVENLABS_API_KEY
  ELEVENLABS_VOICE_ID:
    file: ./secrets/ELEVENLABS_VOICE_ID
  TWILIO_AUTH_TOKEN:
    file: ./secrets/TWILIO_AUTH_TOKEN

volumes:
  ollama_data:
  chatterbox_cache:
  chatterbox_tts_cache:
  shared_audio:
